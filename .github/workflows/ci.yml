# Runs the test suite on every push and pull request.
# The tests mock GhostService, so no Ollama or model is needed on the runner.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test